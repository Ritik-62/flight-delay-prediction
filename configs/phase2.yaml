project:
  name: "flight-delay-prediction"
  phase: "Phase 2 - Gradient Boosting, Temporal Deep Learning & Offline Rescheduling"
  version: "2.0.0"
  author: "ML Research Engineering"
  seed: 42

data:
  raw_path: "data/raw/flights.parquet"
  airlines_path: "data/raw/airlines.parquet"
  airports_path: "data/raw/airports.parquet"
  sample_size: 350000
  chunk_size: 100000

target:
  name: "ARR_DEL15"
  raw_target_col: "ARRIVAL_DELAY"
  threshold_minutes: 15
  description: "Binary indicator: 1 if arrival delay >= 15 minutes, 0 otherwise"

prediction_timestamp:
  minutes_before_departure: 60
  description: "Fixed decision point at T - 60 minutes prior to scheduled departure"
  assumption_notes: >
    All operational predictors must be known at least 60 minutes prior to scheduled departure.
    Actual departure delay, taxi times, wheels-off times, and post-flight operational outcomes
    are strictly excluded. Turnaround features observe inbound aircraft status only up to T - 60.

leakage:
  denylist:
    - "ARR_DELAY"
    - "ARR_DELAY_NEW"
    - "ARR_DEL15"
    - "ARR_DELAY_GROUP"
    - "DEP_DELAY"
    - "DEP_DELAY_NEW"
    - "DEP_DEL15"
    - "DEP_DELAY_GROUP"
    - "DEPARTURE_TIME"
    - "ARRIVAL_TIME"
    - "WHEELS_OFF"
    - "WHEELS_ON"
    - "TAXI_OUT"
    - "TAXI_IN"
    - "ELAPSED_TIME"
    - "AIR_TIME"
    - "CANCELLATION_REASON"
    - "AIR_SYSTEM_DELAY"
    - "SECURITY_DELAY"
    - "AIRLINE_DELAY"
    - "LATE_AIRCRAFT_DELAY"
    - "WEATHER_DELAY"
    - "DIVERTED"
    - "CANCELLED"
  allowlist:
    - "YEAR"
    - "MONTH"
    - "DAY"
    - "DAY_OF_WEEK"
    - "AIRLINE"
    - "ORIGIN_AIRPORT"
    - "DESTINATION_AIRPORT"
    - "ROUTE"
    - "SCHEDULED_DEPARTURE"
    - "SCHEDULED_ARRIVAL"
    - "SCHEDULED_TIME"
    - "DISTANCE"
    - "TAIL_NUMBER"
    - "ORIGIN_CONGESTION_1H"
    - "DEST_CONGESTION_1H"
    - "INBOUND_SCHEDULED_BUFFER_MIN"
    - "INBOUND_DELAY_KNOWN"
    - "INBOUND_UNARRIVED_AT_T60"

temporal_split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  embargo_days: 1
  date_column: "FLIGHT_DATE"

historical_features:
  smoothing_weight: 15.0
  min_samples: 5
  entities:
    - "AIRLINE"
    - "ORIGIN_AIRPORT"
    - "DESTINATION_AIRPORT"
    - "ROUTE"

models:
  logistic_regression:
    penalty: "l2"
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    scale_pos_weight: "auto"
    eval_metric: "logloss"
    early_stopping_rounds: 25
    random_state: 42
    n_jobs: 1
    tree_method: "hist"
  lightgbm:
    n_estimators: 350
    num_leaves: 31
    max_depth: 7
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    scale_pos_weight: "auto"
    random_state: 42
    n_jobs: 1
  neural_network:
    mlp_embedding:
      airline_dim: 16
      origin_dim: 32
      dest_dim: 32
      hidden_dims: [256, 128, 64]
      dropout: 0.2
      learning_rate: 0.001
      weight_decay: 1e-4
      batch_size: 512
      epochs: 15
      early_stopping_patience: 4
    temporal_lstm:
      hidden_dim: 64
      num_layers: 2
      dropout: 0.2
      learning_rate: 0.001
      batch_size: 512
      epochs: 12
      early_stopping_patience: 3

tuning:
  enabled: true
  n_trials: 10
  timeout_seconds: 300
  metric: "pr_auc"

calibration:
  method: "sigmoid"
  n_bins: 10

evaluation:
  target_precision: 0.70
  operational_threshold: 0.50

rescheduling:
  threshold_risk: 0.45
  delay_buffer_minutes: 30
  high_risk_cutoff: 0.65
  slot_penalty_weight: 0.25

paths:
  results_dir: "results"
  models_dir: "models"
  reports_dir: "reports"
  logs_dir: "logs"
  artifacts_dir: "artifacts"
